model:
  name: resnet50
  pretrained: true
  dropout: 0.2

data:
  images_dir: data/raw/images
  labels_csv: data/processed/labels_clean.csv
  train_frac: 0.70
  val_frac: 0.15
  seed: 42

training:
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.00001
  epochs: 6
  loss: bce           # bce | weighted_bce | focal
  focal_alpha: 0.25
  focal_gamma: 2.0
  num_workers: 2
  early_stopping_patience: 3

augmentation:
  horizontal_flip: true
  rotation_degrees: 10
  brightness_contrast: true

mlflow:
  experiment_name: medvision-chestxray
  tracking_uri: sqlite:///mlflow.db

output:
  checkpoint_dir: models
  run_name: resnet50_baseline
