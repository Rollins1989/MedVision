[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "medvision"
version = "1.1.0"
description = "Explainable multi-label chest X-ray analysis with PyTorch and FastAPI"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Kuldeep Singh Chauhan" }]
keywords = ["medical-imaging", "computer-vision", "chest-xray", "pytorch", "explainable-ai", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/Rollins1989/MedVision"
Documentation = "https://github.com/Rollins1989/MedVision/tree/main/docs"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov>=6,<8",
  "ruff>=0.13,<1",
  "pre-commit>=4,<5",
]

[tool.setuptools.packages.find]
include = ["app*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["slow: marks tests that require more compute or external fixtures"]

[tool.coverage.run]
branch = true
source = ["app", "src"]
omit = ["*/__init__.py", "src/data/synthetic_generator.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover"]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
