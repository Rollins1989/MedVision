[project]
name = "medvision"
version = "1.0.0"
description = "Explainable multi-label chest X-ray analysis: PyTorch + FastAPI + PostgreSQL"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
